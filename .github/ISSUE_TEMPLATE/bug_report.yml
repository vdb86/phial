name: 🐞 Bug report
description: Something in Phial isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](../issues) first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug clearly. What did you see?
      placeholder: When I open Phial from the lock screen, the screen...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: The screen should have...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we make the bug happen?
      placeholder: |
        1. Open Phial
        2. Tap ...
        3. See error
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device model
      placeholder: e.g. Samsung Galaxy S23, Google Pixel 7
    validations:
      required: true
  - type: input
    id: android-version
    attributes:
      label: Android version
      placeholder: e.g. Android 14
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Phial version
      description: Find it in the app's settings, or on the Google Play listing.
      placeholder: e.g. 1.4
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording (optional)
      description: Drag and drop images or a short video here if it helps show the problem.
    validations:
      required: false
